<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c36"/>
      <stop offset="60%" stop-color="#0c2d54"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="sphereGrad3" cx="75%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#051c36" stop-opacity="0"/>
    </radialGradient>
    <pattern id="isoPattern3" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
      <circle cx="30" cy="30" r="1" fill="#34d399" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bgGrad3)"/>
  <rect width="1600" height="800" fill="url(#isoPattern3)"/>
  <circle cx="1200" cy="380" r="450" fill="url(#sphereGrad3)"/>

  <!-- Tracking Radar Rings -->
  <g transform="translate(1220, 380)" opacity="0.85">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="70" fill="#065f46" fill-opacity="0.4" stroke="#6ee7b7" stroke-width="2" stroke-opacity="0.6"/>
    
    <!-- Center Pin / Radar pulse -->
    <circle cx="0" cy="0" r="18" fill="#10b981" filter="drop-shadow(0 0 10px #34d399)"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>

    <!-- Timeline checkpoints -->
    <circle cx="-110" cy="-40" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
    <circle cx="60" cy="-100" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <circle cx="100" cy="70" r="10" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
