<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031b3d"/>
      <stop offset="50%" stop-color="#0B2B5C"/>
      <stop offset="100%" stop-color="#0f3c7e"/>
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sphereGrad1" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#031b3d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPattern1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="800" fill="url(#bgGrad1)"/>
  
  <!-- Subtle Grid Pattern -->
  <rect width="1600" height="800" fill="url(#gridPattern1)"/>

  <!-- Radial Glow Accents -->
  <circle cx="1250" cy="350" r="450" fill="url(#sphereGrad1)"/>
  <circle cx="200" cy="700" r="350" fill="url(#sphereGrad1)"/>

  <!-- Flowing Wave Lines -->
  <path d="M-100,600 C300,500 600,750 1000,650 C1300,570 1500,700 1700,620 L1700,850 L-100,850 Z" fill="url(#glowGrad1)"/>
  <path d="M-50,450 C400,350 750,550 1150,420 C1400,340 1550,450 1700,380" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-opacity="0.2"/>
  <path d="M-50,500 C420,400 780,600 1180,470 C1430,390 1580,500 1700,430" fill="none" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="8 6"/>

  <!-- Modern Graphic Icons (Shield & Transparency Portal) -->
  <g transform="translate(1150, 240)" opacity="0.85">
    <!-- Outer Floating Glass Ring -->
    <circle cx="100" cy="100" r="140" fill="#1e3a8a" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="100" cy="100" r="110" fill="#1d4ed8" fill-opacity="0.25" stroke="#93c5fd" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Shield / Government Security Icon -->
    <path d="M100,40 L160,65 C160,115 135,155 100,175 C65,155 40,115 40,65 Z" fill="#2563eb" fill-opacity="0.5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Verified Checkmark in Shield -->
    <path d="M80,105 L95,120 L125,85" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Floating Sparkles / Mini Orbs -->
    <circle cx="230" cy="30" r="4" fill="#60a5fa" filter="drop-shadow(0 0 6px #93c5fd)"/>
    <circle cx="-20" cy="160" r="5" fill="#93c5fd" filter="drop-shadow(0 0 8px #60a5fa)"/>
    <circle cx="210" cy="190" r="3" fill="#ffffff"/>
  </g>
</svg>
