<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b38"/>
      <stop offset="50%" stop-color="#0f2b5c"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sphereGrad2" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#071b38" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotPattern2" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bgGrad2)"/>
  <rect width="1600" height="800" fill="url(#dotPattern2)"/>

  <circle cx="1200" cy="400" r="500" fill="url(#sphereGrad2)"/>

  <!-- Geometric Decorative Polygonal Grid -->
  <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" fill="none">
    <polygon points="1100,200 1350,150 1450,350 1300,550 1050,450"/>
    <polygon points="1150,250 1300,200 1400,350 1280,480 1100,400"/>
    <line x1="1100" y1="200" x2="1300" y2="550"/>
    <line x1="1350" y1="150" x2="1050" y2="450"/>
  </g>

  <!-- Document & Analytics Hologram Graphics -->
  <g transform="translate(1180, 240)" opacity="0.9">
    <!-- Document Stack -->
    <rect x="20" y="20" width="160" height="210" rx="16" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" transform="rotate(-6 100 125)"/>
    <rect x="40" y="30" width="160" height="210" rx="16" fill="#0f172a" fill-opacity="0.6" stroke="#bae6fd" stroke-width="2" stroke-opacity="0.7"/>
    
    <!-- Document Content Lines -->
    <rect x="65" y="60" width="60" height="10" rx="4" fill="#38bdf8"/>
    <rect x="65" y="85" width="110" height="6" rx="3" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="65" y="100" width="95" height="6" rx="3" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="65" y="115" width="105" height="6" rx="3" fill="#ffffff" fill-opacity="0.5"/>

    <!-- Bar Chart Inside Document -->
    <rect x="65" y="160" width="16" height="40" rx="3" fill="#38bdf8"/>
    <rect x="88" y="145" width="16" height="55" rx="3" fill="#60a5fa"/>
    <rect x="111" y="130" width="16" height="70" rx="3" fill="#818cf8"/>
    <rect x="134" y="150" width="16" height="50" rx="3" fill="#34d399"/>
  </g>
</svg>
